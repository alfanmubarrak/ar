<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Sederhana dengan AR.js</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs>

    <!-- Kamera -->
    <a-entity camera></a-entity>

    <!-- Marker Hiro -->
    <a-marker preset="hiro">

        <!-- Objek 3D -->
        <a-cone
            position="0 0.5 0"
            radius-bottom="0.3"
            radius-top="0"
            height="1"
            color="red">
        </a-cone>

        <a-cylinder
            position="0 -0.2 0"
            radius="0.2"
            height="0.5"
            color="silver">
        </a-cylinder>

    </a-marker>

</a-scene>

</body>
</html>
