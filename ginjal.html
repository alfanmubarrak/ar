<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Ginjal 3D</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

    <a-scene embedded arjs="trackingMethod: best;">

        <!-- Memuat model 3D -->
        <a-assets>
            <a-asset-item id="ginjalModel" src="ginjal.glb"></a-asset-item>
        </a-assets>

        <!-- Marker Custom -->
        <a-marker type="pattern" url="pattern-ginjal.patt">

            <!-- Model 3D Ginjal -->
            <a-entity
                gltf-model="#ginjalModel"
                position="0 0 0"
                rotation="-90 0 0"
                scale="4 4 4"
                animation="property: rotation; to: -90 360 0; loop: true; dur: 8000">
            </a-entity>

        </a-marker>

        <!-- Kamera -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
